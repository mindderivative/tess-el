[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tess-el"  # on PyPI (free on 2026-10-25); `tel` there is taken. The import name is `tel`.
version = "0.0.1"
description = "TEL, the Tesserae Expression Language: a small, safe expression language for YAML and Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Mind Derivative" }]
keywords = ["expression-language", "yaml", "sandbox", "declarative"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mindderivative/tess-el"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "loguru>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/tel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # `reference/` and `benchmarks/` are dev-only packages at the repo root

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]  # third-party skills, kept as published
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"reference/cases.py" = ["E501"]  # ported verbatim from Tesserae
# The compiler binds what each closure uses as default arguments on purpose (a captured variable
# costs a 40-byte cell, a default 8); B008 is about mutable defaults evaluated at definition.
"src/tel/_compiler.py" = ["B008"]
"tools/removal_check.py" = ["E501"]  # the rule tables hold patterns from the source they break
"reference/expectations.py" = ["E501"]  # keys and comments quote the ported corpus

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# On Python 3.14 every annotated nested function also allocates an `__annotate__` function
# (630 bytes and 147 ns per closure against 385 and 89 without), and the compiler makes one
# closure per node. Its module-level functions stay annotated; the closures do not.
module = "tel._compiler"
disallow_untyped_defs = false
disallow_incomplete_defs = false
