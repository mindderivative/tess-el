[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tess-el"  # on PyPI (free on 2026-10-25); `tel` there is taken. The import name is `tel`.
version = "0.0.1"
description = "TEL, the Tesserae Expression Language: a small, safe expression language for YAML and Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{ name = "Mind Derivative" }]
keywords = ["expression-language", "yaml", "sandbox", "declarative"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/mindderivative/tess-el"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10", "loguru>=0.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/tel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".agents"]  # third-party skills, kept as published
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
