# Builds the MkDocs site from docs/ and deploys it to GitHub Pages
# (https://mindderivative.github.io/tess-el/). A documentation update, not a
# release: it runs when docs/, mkdocs.yml or this file change on main, and
# `mkdocs build --strict` fails on a broken link or heading anchor. The docs
# never import the package, so only the two doc packages are installed.
# Pages must be set to "Build and deployment: GitHub Actions" once (Settings >
# Pages, or `gh api -X POST repos/mindderivative/tess-el/pages
# -f build_type=workflow`).
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5"
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
