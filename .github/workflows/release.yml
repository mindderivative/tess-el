name: Release

# Publishes to PyPI with Trusted Publishing (OpenID Connect): no API token is stored anywhere.
#
#   * push a tag `vX.Y.Z`            -> test, build, publish to PyPI, then a GitHub release
#   * run it by hand (Actions tab)   -> test, build, publish to TestPyPI only
#
# One-time setup is in docs/versioning.md ("Setting up PyPI").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: false
      - name: The tag, pyproject.toml and tel.__version__ agree
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          init = re.search(r'__version__ = "([^"]+)"', open("src/tel/__init__.py").read()).group(1)
          assert version == init, f"pyproject {version} != tel.__version__ {init}"
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              tag = os.environ["GITHUB_REF_NAME"]
              assert tag == f"v{version}", f"tag {tag} != v{version}"
          heading = re.compile(rf"^## {re.escape(version)}( |$)", re.M)
          assert heading.search(open("CHANGELOG.md").read()), f"CHANGELOG.md has no section for {version}"
          print("version", version)
          PY
      - run: uv sync --python 3.14
      - run: uv run python tools/check.py
      - run: uv build --out-dir dist
      - name: The wheel imports in a clean environment and pulls in nothing else
        run: |
          uv venv --python 3.14 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp && /tmp/smoke/bin/python -I -c "import sys, tel; print(tel.__version__); assert not [m for m in sys.modules if m.split('.')[0] in ('tesserae', 'tre', 'yaml')]"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: github.ref_type == 'tag'
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: The changelog section of this version is the release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$1 == "##" && $2 == v {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
